name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Fetch trusted CI image and reject outdated builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$latest" = "$REVISION" || { echo 'A newer main revision exists; refusing stale deployment'; exit 1; }
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name deployment-image --dir .state/artifact
          image=$(cat .state/artifact/image.txt)
          prefix="ghcr.io/${REPOSITORY,,}@sha256:"
          test "${image:0:${#prefix}}" = "$prefix"
          digest=${image#"$prefix"}
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
      - name: Configure pinned SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Upload and deploy with automatic rollback
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$PUBLIC_URL" =~ ^https?://[a-zA-Z0-9.:-]+/?$ ]]
          image=$(cat .state/artifact/image.txt)
          release="/opt/lazyum/releases/${REVISION}-${RUN_ID}"
          ssh_opts=(-i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          # Keep registry credentials in a temporary server-side Docker config only.
          printf '%s' "$REGISTRY_TOKEN" | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; mkdir -p '$release'; cfg=\$(mktemp -d); trap 'rm -rf -- \"\$cfg\"' EXIT; DOCKER_CONFIG=\$cfg docker login ghcr.io -u '$REGISTRY_USER' --password-stdin && DOCKER_CONFIG=\$cfg docker pull '$image'"
          tar -czf .state/release.tar.gz compose.yaml compose.production.yaml infra/Caddyfile scripts/deploy.sh scripts/rollback.sh scripts/smoke.py
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .state/release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$release/release.tar.gz"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "tar -xzf '$release/release.tar.gz' -C '$release'; bash '$release/scripts/deploy.sh' /opt/lazyum '$image' '$REVISION' '$PUBLIC_URL'"
          if ! python scripts/smoke.py "$PUBLIC_URL" --revision "$REVISION"; then
            echo 'External smoke failed; requesting rollback of the same revision' >&2
            ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "test \"\$(cat /opt/lazyum/current/revision)\" = '$REVISION' && bash /opt/lazyum/current/scripts/rollback.sh /opt/lazyum"
            exit 1
          fi
      - name: Remove local SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
